name: Deploy to Shopify Oxygen

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    name: Deploy to Oxygen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_ID: ${{ secrets.PUBLIC_STOREFRONT_ID }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          PRIVATE_STOREFRONT_API_TOKEN: ${{ secrets.PRIVATE_STOREFRONT_API_TOKEN }}
          ADMIN_API_ACCESS_TOKEN: ${{ secrets.ADMIN_API_ACCESS_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Deploy to Oxygen
        if: github.ref == 'refs/heads/main'
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_FLAG_PATH: "./dist"
          SHOPIFY_CLI_HYDROGEN_FLAG_PATH: "./dist"
